repos:
- repo: local
  hooks:
  - id: lint-packages
    name: Lint split packages
    language: golang
    entry: bash -c '[ ! -d packages ] || goimports -w packages'
    pass_filenames: false
    additional_dependencies:
      - golang.org/x/tools/cmd/goimports@v0.30.0
  - id: tidy-packages
    name: Tidy split packages
    language: golang
    entry: scripts/tidy-packages.sh
    pass_filenames: false
  - id: docs
    name: Format documentation
    stages: [manual]
    language: node
    language_version: 20.5.0
    entry: prettier --write --list-different --ignore-unknown
    # "types": [text]
    files: 'README.md'
    pass_filenames: true
    additional_dependencies:
      # When updating the version of prettier, make sure to check the  pre-commit file
      # And keep the `entry` here up to date https://github.com/pre-commit/mirrors-prettier/blob/master/.pre-commit-hooks.yaml
      - prettier@3.0.0
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-case-conflict
